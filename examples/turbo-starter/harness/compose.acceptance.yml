# Лёгкий стек приёмки devcontour-harness: только PostgreSQL из infra/dev/docker-compose.yml
# Turbo Starter (тот же образ и healthcheck). Без name, container_name, bind mounts и
# портов по умолчанию: имя проекта, порт и учётные данные задаёт compose-bridge на каждую
# попытку и фазу (env-файл вне рабочего дерева).
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '127.0.0.1:${POSTGRES_PORT:?POSTGRES_PORT}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 1s
      timeout: 5s
      retries: 60

volumes:
  postgres_data: {}
