[project]
name = "fx-label"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest==8.4.1", "ruff==0.12.4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
